<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarf Malzeme Takip</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/table-filters.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#stok"><span class="mark" aria-hidden="true">S</span><span>Sarf Malzeme<strong>Takip</strong></span></a>
    <nav aria-label="Ana menü" hidden>
      <a href="#stok">Stok durumu</a>
      <a href="#hareketler">Stok hareketleri</a>
      <a href="#sayimlar">Sayım</a>
      <a href="#urunler">Ürün kartları</a>
      <a href="#tanimlar">Departman ve personel</a>
      <a href="#raporlar">Tüketim raporları</a>
      <a href="#excel" hidden>Excel içe aktar</a>
      <a href="#kullanicilar" hidden>Kullanıcılar ve yetkiler</a>
      <a href="#donem-kilidi" hidden>Dönem kilidi</a>
    </nav>
    <div class="warehouse"><span aria-hidden="true"></span> Satın Alma Deposu</div>
  </aside>
  <main>
    <header class="toolbar">
      <span class="crumb">Satın Alma Deposu <span id="demo-label" class="pill warning" hidden>Demo verisi</span></span>
      <div class="actions">
        <span id="account-label" class="sub" hidden></span>
        <button type="button" id="logout" hidden>Oturumu kapat</button>
        <button data-action="receipt" hidden>Alış girişi</button>
        <button class="primary" data-action="person" hidden>+ Malzeme teslimi</button>
      </div>
    </header>
    <div id="content" class="content">
      <p>Stok bilgileri yükleniyor…</p>
    </div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title"></h2>
      <button type="button" id="close-modal" aria-label="Pencereyi kapat">×</button>
    </header>
    <form id="form">
      <div id="fields"></div>
      <p id="form-error" role="alert" tabindex="-1" hidden></p>
      <footer class="modal-footer">
        <button type="button" id="cancel-modal">Vazgeç</button>
        <button class="primary" type="submit">Kaydet</button>
      </footer>
    </form>
  </dialog>
  <dialog id="history-modal" aria-labelledby="history-title">
    <header class="modal-header">
      <h2 id="history-title">Tanım geçmişi</h2>
      <form method="dialog"><button aria-label="Geçmişi kapat">×</button></form>
    </header>
    <div id="history-results" class="history-results" aria-live="polite"></div>
  </dialog>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <div id="column-filter" class="column-filter" popover="auto" role="dialog" aria-labelledby="column-filter-title"></div>
</body>
</html>
